name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de las funciones
        run: npm install
        working-directory: functions

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Preparar credenciales
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEPLOY }}' > "$HOME/sa.json"
          echo "Tamaño del archivo de credenciales:"
          wc -c "$HOME/sa.json"

      - name: Verificar acceso
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/sa.json
        run: firebase projects:list

      - name: Desplegar funciones
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/sa.json
        run: firebase deploy --only functions --project masterplanproyects --non-interactive --force

      - name: Limpiar credenciales
        if: always()
        run: rm -f "$HOME/sa.json"
