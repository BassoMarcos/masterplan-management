name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      # Sin "repoToken": se sigue armando la copia de prueba, pero el robot ya no comenta el link
      # en el cambio (ese comentario le llegaba por mail a Marcos). El link queda en el registro de Actions.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MASTERPLANPROYECTS }}
          projectId: masterplanproyects
